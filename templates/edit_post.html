{% extends 'base.html' %}

{% block content %}

<h2>Edit Post</h2>

<form method="POST">

<input type="text"
name="title"
value="{{post.title}}"
class="form-control mb-3">

<textarea
name="content"
class="form-control mb-3"
rows="6">{{post.content}}</textarea>

<button class="btn btn-warning">
Update
</button>

</form>

{% endblock %}
