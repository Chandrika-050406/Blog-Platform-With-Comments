{% extends 'base.html' %}

{% block content %}

<h2>All Blog Posts</h2>

{% for post in posts %}


<div class="card my-3">

<div class="card-body">

<h3>{{ post.title }}</h3>

<p>{{ post.content[:150] }}...</p>

<a href="/post/{{post.id}}" class="btn btn-primary">
Read More
</a>

<a href="/edit/{{post.id}}" class="btn btn-warning">
Edit
</a>

<a href="/delete/{{post.id}}" class="btn btn-danger">
Delete
</a>

</div>

</div>

{% endfor %}

{% endblock %}
