{% extends 'base.html' %}

{% block content %}

<h2>Create Blog Post</h2>

<form method="POST">

<input type="text"
name="title"
class="form-control mb-3"
placeholder="Title">

<textarea
name="content"
class="form-control mb-3"
rows="6"></textarea>

<button class="btn btn-success">
Publish
</button>

</form>

{% endblock %}
